# 워크플로우 이름
name: Deploy Frontend to DEV environment

# 워크플로우 실행 조건
on:
  push:
    branches:
      - dev
    paths:
      - 'front-end/flutter/doctor_goblin/**'

# 실행될 작업들
jobs:
  build_and_deploy:
    # 실행 환경 지정
    runs-on: ubuntu-latest
    
    # 작업 단계들
    steps:
      # 1~4 단계는 동일
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./front-end/flutter/doctor_goblin
      - name: Build Flutter web app
        run: flutter build web
        working-directory: ./front-end/flutter/doctor_goblin

      # 5. NAS-PC에 있는 배치 스크립트를 실행하여 폴더 생성 (성공)
      - name: Create temporary directory on NAS-PC
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 49152
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            C:\DeployScripts\create_temp_dir.bat

      # 6. 생성된 폴더에 빌드 결과물 복사 (성공)
      - name: Copy build files to NAS-PC
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 49152
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "front-end/flutter/doctor_goblin/build/web/*"
          target: "temp/dev-app-new"
          strip_components: 4

      # 7. [수정] NAS-PC에 있는 PowerShell 스크립트를 실행하여 배포
      - name: Deploy on NAS-PC
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 49152
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            powershell -ExecutionPolicy Bypass -File "C:\DeployScripts\deploy_app.ps1"