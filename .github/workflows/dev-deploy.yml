# 워크플로우 이름
name: Deploy Frontend to DEV environment

# 워크플로우 실행 조건
on:
  push:
    branches:
      - dev
    paths:
      - 'front-end/flutter/doctor_goblin/**'

# 실행될 작업들
jobs:
  build_and_deploy:
    # 실행 환경 지정
    runs-on: ubuntu-latest
    
    # 작업 단계들
    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Flutter 환경 설정
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'

      # 3. Flutter 의존성 설치
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./front-end/flutter/doctor_goblin

      # 4. Flutter 웹 앱 빌드
      - name: Build Flutter web app
        run: flutter build web
        working-directory: ./front-end/flutter/doctor_goblin

      # 5. [수정] NAS-PC에 있는 배치 스크립트를 실행하여 폴더 생성
      - name: Create temporary directory on NAS-PC
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 49152
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            C:\DeployScripts\create_temp_dir.bat

      # 6. 생성된 폴더에 빌드 결과물 복사
      - name: Copy build files to NAS-PC
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 49152
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "front-end/flutter/doctor_goblin/build/web/*"
          target: "temp/dev-app-new" # 경로는 이전과 동일하게 유지
          strip_components: 4

      # 7. NAS-PC에서 배포 스크립트 실행
      - name: Deploy on NAS-PC
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 49152
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            powershell -Command {
              $ErrorActionPreference = "Stop"

              try {
                $targetDir = "C:/tools/nginx-1.29.0/html/dev-app"
                $sourceDir = "$HOME/temp/dev-app-new"

                if (Test-Path $targetDir) {
                  Remove-Item -Path $targetDir -Recurse -Force
                }
                
                Move-Item -Path $sourceDir -Destination $targetDir
                
                Start-Process -FilePath "C:/tools/nginx-1.29.0/nginx.exe" -ArgumentList "-s", "reload" -Verb RunAs -Wait
                
                Write-Host "Deployment successful!"
              } catch {
                Write-Error "Deployment failed: $_"
                exit 1
              }
            }