# 워크플로우 이름
name: Deploy Frontend to DEV environment

# 워크플로우 실행 조건
on:
  push:
    branches:
      - dev
    paths:
      - 'front-end/flutter/doctor_goblin/**'

# 실행될 작업들
jobs:
  build_and_deploy:
    # 실행 환경 지정
    runs-on: ubuntu-latest
    
    # 작업 단계들
    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Flutter 환경 설정
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'

      # 3. Flutter 의존성 설치
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./front-end/flutter/doctor_goblin

      # 4. Flutter 웹 앱 빌드
      - name: Build Flutter web app
        run: flutter build web
        working-directory: ./front-end/flutter/doctor_goblin

      # 5. 빌드된 파일을 NAS-PC의 임시 폴더로 복사 (SCP 사용)
      - name: Copy build files to NAS-PC
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 49152
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "front-end/flutter/doctor_goblin/build/web/*"
          # [수정] '~/'를 제거하고 상대 경로로 지정
          target: "temp/dev-app-new"
          strip_components: 4

      # 6. NAS-PC에서 원격 스크립트 실행 (SSH 사용)
      - name: Deploy on NAS-PC
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 49152
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            powershell -Command {
              $ErrorActionPreference = "Stop"

              try {
                $targetDir = "C:/tools/nginx-1.29.0/html/dev-app"
                # PowerShell의 $HOME 변수는 정상적으로 작동하므로 이 부분은 수정할 필요 없습니다.
                $sourceDir = "$HOME/temp/dev-app-new"

                if (Test-Path $targetDir) {
                  Write-Host "Removing old directory: $targetDir"
                  Remove-Item -Path $targetDir -Recurse -Force
                }
                
                Write-Host "Moving new files from $sourceDir to $targetDir"
                Move-Item -Path $sourceDir -Destination $targetDir
                
                Write-Host "Reloading Nginx"
                Start-Process -FilePath "C:/tools/nginx-1.29.0/nginx.exe" -ArgumentList "-s", "reload" -Verb RunAs -Wait
                
                Write-Host "Deployment successful!"
              } catch {
                Write-Error "Deployment failed: $_"
                exit 1
              }
            }